[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitter-bookmarks-downloader"
version = "0.1.0"
description = "自动登录并下载 Twitter 书签视频的 Playwright 工具"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "playwright==1.48.0",
    "yt-dlp==2024.10.22",
    "python-dotenv==1.0.1",
    "typer==0.12.5",
    "rich==13.9.2",
    "fastapi==0.110.2",
    "uvicorn==0.30.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

